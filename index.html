    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Tahoma, Arial, sans-serif;

            min-height: 100vh;

            /* مكان الصورة لاحقاً */
            background-image:
    linear-gradient(
        rgba(0, 0, 0, 0.20),
        rgba(0, 0, 0, 0.20)
    ),
    url("IMG_6797.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;
        }


        /* الحاوية الرئيسية */

        .container {
            width: 100%;
            max-width: 480px;

            text-align: center;

            padding: 35px 20px;

            background: rgba(0, 0, 0, 0.05);

            border-radius: 25px;

            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(2px);

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.35);
        }


        /* العنوان */

        .title {
            font-size: 38px;
            font-weight: 700;

            letter-spacing: 1px;

            margin-bottom: 8px;

            text-shadow:
                0 3px 10px rgba(0, 0, 0, 0.6);
        }


        /* الوصف */

        .description {
            font-size: 17px;

            margin-bottom: 28px;

            opacity: 0.95;

            line-height: 1.7;

            text-shadow:
                0 2px 7px rgba(0, 0, 0, 0.6);
        }


        /* عنوان وسائل التواصل */

        .social-title {
            font-size: 20px;

            font-weight: 600;

            margin-bottom: 18px;
        }


        /* الأزرار */

        .button {
            display: block;

            width: 100%;

            padding: 15px 20px;

            margin: 13px 0;

            border-radius: 14px;

            text-decoration: none;

            color: #0B2D5C;

            font-size: 17px;

            font-weight: 600;

            background: rgba(255, 255, 255, 0.18);

            border: 1px solid rgba(255, 255, 255, 0.30);

            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.20);
        }


        .button:hover {
            transform: translateY(-2px);

            background:
                rgba(255, 255, 255, 0.28);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.30);
        }


        .button:active {
            transform: scale(0.98);
        }


        /* الفوتر */

        .footer {
            margin-top: 30px;

            font-size: 13px;

            opacity: 0.75;

            line-height: 1.6;
        }


        /* تحسين الجوال */

        @media (max-width: 600px) {

            body {
                padding: 15px 10px;

                background-attachment: scroll;
            }

            .container {
                padding: 30px 17px;

                border-radius: 22px;
            }

            .title {
                font-size: 32px;
            }

            .description {
                font-size: 16px;
            }

            .button {
                padding: 14px 18px;

                font-size: 16px;
            }
        }

    </style>
